<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0820">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>High Dimension</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0820;--bg2:#1b0f3a;--gold:#e8c979;--gold2:#b98a2e;--violet:#8b5cf6;--teal:#3dd6c6;--ink:#f4eefc;--mute:#b6a9d4;--card:rgba(255,255,255,.07);--line:rgba(232,201,121,.25)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(120% 60% at 50% -10%,#3b1a78 0%,var(--bg2) 40%,var(--bg) 100%) fixed;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;overflow-x:hidden}
.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff8 50%,transparent),radial-gradient(1px 1px at 70% 20%,#fff9 50%,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#e8c979aa 50%,transparent),radial-gradient(1px 1px at 85% 60%,#fff8 50%,transparent),radial-gradient(1px 1px at 10% 85%,#fff7 50%,transparent),radial-gradient(1.5px 1.5px at 60% 90%,#3dd6c688 50%,transparent);background-size:340px 340px;animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.5}to{opacity:1}}
.mandala{position:fixed;top:-120px;left:50%;width:520px;height:520px;margin-left:-260px;opacity:.16;pointer-events:none;animation:spin 140s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.app{position:relative;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
header{text-align:center;padding:10px 0 18px}
.logo{width:54px;height:54px;margin:0 auto 6px;filter:drop-shadow(0 0 14px #e8c97988)}
h1{font-family:'Cinzel',serif;font-weight:700;font-size:25px;letter-spacing:.22em;background:linear-gradient(90deg,var(--gold),#fff3cf,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-style:italic;font-size:17px;margin-top:2px}
.divider{height:1px;margin:14px auto 0;width:70%;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hero{position:relative;display:block;border-radius:26px;overflow:hidden;margin:18px 0 20px;min-height:250px;color:inherit;text-decoration:none;border:1px solid var(--line);box-shadow:0 18px 50px -12px #000a,0 0 40px -10px #8b5cf655;background:linear-gradient(135deg,#4c1d95,#1e1b4b)}
.hero .img,.card .img{background-size:cover;background-position:center}
.hero .img{position:absolute;inset:0}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,#0d0820f2 95%)}
.hero .txt{position:absolute;left:0;right:0;bottom:0;padding:18px;z-index:2}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.16em;padding:5px 11px;border-radius:99px;background:#0d082099;border:1px solid var(--line);backdrop-filter:blur(8px);color:var(--gold)}
.tag.v{color:var(--teal);border-color:#3dd6c655}
.hero h2{font-family:'Cinzel',serif;font-size:21px;line-height:1.25;margin:10px 0 4px;font-weight:500}
.meta{color:var(--mute);font-size:15px}
.play{position:absolute;top:16px;right:16px;z-index:2;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#ffffff22;backdrop-filter:blur(10px);border:1px solid #fff4}
.sec{font-family:'Cinzel',serif;letter-spacing:.2em;font-size:12px;color:var(--gold);margin:6px 4px 12px;display:flex;align-items:center;gap:10px}
.sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.card{display:flex;gap:14px;padding:12px;margin-bottom:12px;border-radius:20px;background:var(--card);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(14px);text-decoration:none;color:inherit;transition:transform .2s,border-color .2s;animation:up .5s both}
.card:active{transform:scale(.97);border-color:var(--gold)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card .img{flex:0 0 104px;height:104px;border-radius:14px;position:relative;background-color:#2a1659;display:grid;place-items:center;font-size:30px;color:var(--gold);overflow:hidden}
.card .img.has{color:transparent}
.card .b{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px}
.card h3{font-family:'Cinzel',serif;font-weight:500;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card p{font-size:15.5px;color:var(--mute);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note{text-align:center;color:var(--mute);font-style:italic;font-size:15px;padding:12px;border:1px dashed var(--line);border-radius:14px;margin-bottom:14px}
.sk{height:104px;border-radius:20px;margin-bottom:12px;background:linear-gradient(100deg,#ffffff0a 30%,#ffffff1c 50%,#ffffff0a 70%) 0 0/200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:4px;padding:6px;border-radius:99px;background:#150b30cc;backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 12px 40px #000a;z-index:5}
nav button{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.1em;color:var(--mute);background:none;border:0;padding:12px 18px;border-radius:99px;cursor:pointer}
nav button.on{color:#1a0f33;background:linear-gradient(135deg,var(--gold),#fff0bd);font-weight:700}
.ref{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#150b3099;backdrop-filter:blur(10px);color:var(--gold);font-size:18px;cursor:pointer}
.ref.spin{animation:spin 1s linear infinite}
.inst{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 78px);z-index:6;display:none;align-items:center;gap:8px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:.12em;font-weight:700;color:#1a0f33;background:linear-gradient(135deg,var(--gold),#fff0bd);border:0;border-radius:99px;padding:12px 20px;box-shadow:0 0 28px #e8c97988,0 10px 30px #000a;cursor:pointer;animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 44px #e8c979cc,0 10px 30px #000a}}
.ios{position:fixed;inset:auto 16px calc(env(safe-area-inset-bottom,0px) + 80px);z-index:7;display:none;padding:16px;border-radius:20px;background:#1b0f3af2;border:1px solid var(--gold);text-align:center;font-size:17px;backdrop-filter:blur(14px)}
.ios b{color:var(--gold)}
</style>
</head>
<body>
<div class="stars"></div>
<svg class="mandala" viewBox="0 0 200 200" fill="none" stroke="#e8c979" stroke-width=".5"><g id="m"><circle cx="100" cy="100" r="96"/><circle cx="100" cy="100" r="70"/><circle cx="100" cy="100" r="44"/><circle cx="100" cy="100" r="18"/><g id="p"><ellipse cx="100" cy="50" rx="14" ry="44"/></g><use href="#p" transform="rotate(30 100 100)"/><use href="#p" transform="rotate(60 100 100)"/><use href="#p" transform="rotate(90 100 100)"/><use href="#p" transform="rotate(120 100 100)"/><use href="#p" transform="rotate(150 100 100)"/></g></svg>

<button class="ref" id="ref" aria-label="Actualizar">↻</button>

<div class="app">
  <header>
    <svg class="logo" viewBox="0 0 64 64" fill="none" stroke="#e8c979" stroke-width="1.6"><circle cx="32" cy="32" r="29"/><path d="M32 6 L38 26 L58 32 L38 38 L32 58 L26 38 L6 32 L26 26 Z"/><circle cx="32" cy="32" r="7" fill="#e8c97933"/></svg>
    <h1>HIGH DIMENSION</h1>
    <div class="sub">Espiritualidad y sabiduría ancestral</div>
    <div class="divider"></div>
  </header>
  <div id="view"></div>
</div>

<button class="inst" id="inst">✦ INSTALAR APP</button>
<div class="ios" id="ios">Para instalar: toca <b>Compartir</b> y luego <b>«Añadir a pantalla de inicio»</b>.<br><small style="color:var(--mute)">Toca aquí para cerrar</small></div>
<nav id="nav">
  <button class="on" data-f="all">TODO</button>
  <button data-f="video">VÍDEOS</button>
  <button data-f="blog">BLOG</button>
</nav>

<script>
/* ====== CONFIGURACIÓN ====== */
const CONFIG = {
  blogHost: 'highdimensionchannel.blogspot.com',
  ytChannelId: 'UCF5AGOY9d7i_o_7SQGwZhag',
  ytUser: 'Highdimensionchannel',  // se usa solo si no hay ID de canal
  refreshMinutes: 10
};
/* =========================== */

const $ = s => document.querySelector(s);
let items = [], filter = 'all', demo = false;
const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = h => { const d = document.createElement('div'); d.innerHTML = h||''; return (d.textContent||'').replace(/\s+/g,' ').trim(); };
const fmt = d => new Date(d).toLocaleDateString('es', {day:'numeric', month:'long', year:'numeric'});
const j = async u => { const r = await fetch(u); if(!r.ok) throw 0; return r.json(); };
const rss2json = u => j('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(u));

async function loadBlog(){
  const u = `https://${CONFIG.blogHost}/feeds/posts/default?alt=json&max-results=25`;
  const d = await j(u);
  return (d.feed.entry||[]).map(e => {
    const html = (e.content && e.content.$t) || (e.summary && e.summary.$t) || '';
    const m = html.match(/<img[^>]+src=["']([^"']+)/i);
    const link = (e.link||[]).find(l => l.rel === 'alternate');
    return {type:'blog', title:e.title.$t, url:link ? link.href : '#', date:e.published.$t, img:m ? m[1] : '', text:strip(html).slice(0,160)};
  });
}
async function loadYT(){
  const q = CONFIG.ytChannelId ? 'channel_id=' + CONFIG.ytChannelId : 'user=' + CONFIG.ytUser;
  const d = await rss2json('https://www.youtube.com/feeds/videos.xml?' + q);
  return (d.items||[]).map(v => ({type:'video', title:v.title, url:v.link, date:v.pubDate.replace(' ','T') + 'Z', img:v.thumbnail || (v.enclosure && v.enclosure.link) || '', text:strip(v.description).slice(0,160)}));
}

async function load(){
  $('#ref').classList.add('spin');
  const [b, y] = await Promise.allSettled([loadBlog(), loadYT()]);
  const got = [...(b.value||[]), ...(y.value||[])];
  if(got.length){ items = got.sort((a,z) => new Date(z.date) - new Date(a.date)); demo = false; }
  else if(!items.length){ items = sample(); demo = true; }
  $('#ref').classList.remove('spin');
  render();
}

function sample(){
  const t = Date.now(), D = n => new Date(t - n*864e5).toISOString();
  return [
    {type:'video', title:'Vídeo de ejemplo: el despertar de la conciencia', url:'#', date:D(1), img:'', text:'Así se verán tus vídeos cuando la app se conecte a tu canal.'},
    {type:'blog',  title:'Artículo de ejemplo: sabiduría de los ancestros', url:'#', date:D(3), img:'', text:'Así se verán las entradas de tu blog, con miniatura y resumen.'},
    {type:'video', title:'Vídeo de ejemplo: meditación y frecuencia', url:'#', date:D(6), img:'', text:'Se ordenan juntos por fecha y se actualizan solos.'},
    {type:'blog',  title:'Artículo de ejemplo: símbolos sagrados', url:'#', date:D(9), img:'', text:'Toca una tarjeta para abrir la publicación original.'}
  ];
}

function render(){
  const list = items.filter(i => filter === 'all' || i.type === filter);
  const v = $('#view');
  if(!list.length){ v.innerHTML = '<div class="note">Aún no hay publicaciones en esta sección.</div>'; return; }
  const [h, ...rest] = list;
  const tag = i => i.type === 'video' ? '<span class="tag v">▶ VÍDEO</span>' : '<span class="tag">✦ BLOG</span>';
  v.innerHTML =
    (demo ? '<div class="note">Vista previa del diseño con contenido de ejemplo. Al abrir la app desde tu propio alojamiento, se cargarán tus publicaciones reales.</div>' : '') +
    `<a class="hero" href="${esc(h.url)}" target="_blank" rel="noopener">
       <div class="img" style="${h.img ? `background-image:url('${esc(h.img)}')` : ''}"></div>
       ${h.type === 'video' ? '<div class="play">▶</div>' : ''}
       <div class="txt">${tag(h)}<h2>${esc(h.title)}</h2><div class="meta">${fmt(h.date)}</div></div>
     </a>` +
    (rest.length ? '<div class="sec">LO ÚLTIMO</div>' : '') +
    rest.map((i,n) => `<a class="card" style="animation-delay:${n*50}ms" href="${esc(i.url)}" target="_blank" rel="noopener">
       <div class="img ${i.img ? 'has' : ''}" style="${i.img ? `background-image:url('${esc(i.img)}')` : ''}">${i.img ? '' : (i.type === 'video' ? '▶' : '✦')}</div>
       <div class="b">${tag(i)}<h3>${esc(i.title)}</h3><p>${esc(i.text)}</p><div class="meta">${fmt(i.date)}</div></div>
     </a>`).join('');
}

$('#nav').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  filter = b.dataset.f; render(); scrollTo({top:0, behavior:'smooth'});
};
$('#ref').onclick = load;
$('#view').innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
load();
setInterval(load, CONFIG.refreshMinutes * 60000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) load(); });

/* ====== INSTALAR APP ====== */
let deferred = null;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
if(!standalone){
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('#inst').style.display = 'flex'; });
  if(isIOS) $('#inst').style.display = 'flex';
}
$('#inst').onclick = async () => {
  if(deferred){ deferred.prompt(); await deferred.userChoice; deferred = null; $('#inst').style.display = 'none'; }
  else if(isIOS){ $('#ios').style.display = 'block'; }
};
$('#ios').onclick = () => $('#ios').style.display = 'none';
window.addEventListener('appinstalled', () => $('#inst').style.display = 'none');
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
